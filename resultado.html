<!DOCTYPE html>

<head>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="style.css">
<style>
  .res-hero { padding: 32px 0; }
  .res-grid { max-width: 760px; margin: 0 auto; }
  .res-card { background: #0d1424; border: 1px solid rgba(128,198,250,.15); border-radius: 12px; padding: 24px; margin-bottom: 18px; }
  .res-top { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center; margin-bottom: 18px; }
  .nota-wrap { display: flex; align-items: baseline; gap: 8px; }
  .nota { font-family: 'Montserrat', sans-serif; font-size: 56px; font-weight: 900; color: #009FE3; line-height: 1; }
  .nota-label { font-size: 13px; color: #80C6FA; text-transform: uppercase; letter-spacing: .5px; }
  .aviso { background: rgba(255,193,7,.08); border: 1px solid rgba(255,193,7,.25); color: #ffe082; padding: 12px 16px; border-radius: 10px; font-size: 14px; margin-bottom: 18px; }
  .lista { margin: 8px 0; padding-left: 20px; }
  .lista li { margin-bottom: 6px; }
  .acao { border-left: 3px solid #009FE3; padding-left: 12px; margin-bottom: 10px; }
  .prio { display: inline-block; font-size: 12px; font-weight: 700; color: #090D18; background: #80C6FA; padding: 2px 8px; border-radius: 999px; margin-left: 8px; text-transform: uppercase; }
  .prio.alta { background: #009FE3; color: #fff; }
  .prio.media { background: #80C6FA; }
  .prio.baixa { background: rgba(128,198,250,.3); color: #80C6FA; }
  .btn-row { display: flex; flex-wrap: wrap; gap: 12px; margin: 18px 0; }
  .guardar { font-size: 14px; color: #9aa7bc; margin: 0 0 18px; }
  .center { text-align: center; }
  .err { color: #ff6b6b; padding: 24px; text-align: center; }
</style>
</head>

</nav></div></header>
